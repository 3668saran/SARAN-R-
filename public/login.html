<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — StudyMate AI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="card" style="width: 100%; max-width: 400px; padding: 32px 24px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="/index.html" class="brand" style="justify-content: center;"><span>🎓</span> StudyMate AI</a>
      <h3 style="margin-top: 12px;">Student Portal Sign In</h3>
      <p style="color: var(--text-muted); font-size: 13px;">Enter your college credentials or access demo accounts</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <label style="font-weight: 600; font-size: 13px;">Email Address:</label>
      <input type="email" id="email" value="alex.morgan@university.edu" required>

      <label style="font-weight: 600; font-size: 13px;">Password:</label>
      <input type="password" id="password" value="********" required>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In</button>
    </form>

    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; font-size: 13px;">
      <p>Quick Role Sign In:</p>
      <div style="display: flex; gap: 6px; justify-content: center; margin-top: 8px;">
        <button class="btn btn-secondary" style="font-size: 11px; padding: 6px 10px;" onclick="AuthController.switchRole('student')">Student</button>
        <button class="btn btn-secondary" style="font-size: 11px; padding: 6px 10px;" onclick="AuthController.switchRole('staff')">Staff Reviewer</button>
        <button class="btn btn-secondary" style="font-size: 11px; padding: 6px 10px;" onclick="AuthController.switchRole('admin')">Admin</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      localStorage.setItem("studymate_token", "dev-token-student");
      localStorage.setItem("studymate_user", JSON.stringify({
        name: "Alex Morgan",
        email: document.getElementById("email").value,
        role: "student",
        status: "verified"
      }));
      window.location.href = "/dashboard.html";
    }
  </script>
</body>
</html>
